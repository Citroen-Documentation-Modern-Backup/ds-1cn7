<div id="title" class="section_titre"><table class="refDoc"><tbody><tr><td colspan="2" class="references">C5JK0AP0</td><td class="title">Réparation  : Limiteur d’effort</td></tr></tbody></table></div><div id="appl" class="section_appl"> DEPUIS OPR 7483 JUSQU’A OPR 8687</div><div class="section_corps" id="content"><div class="par">Il est impératif de remplacer les ceintures de sécurité avant, suite à un choc ayant provoqué le déclenchement des "airbags", les barres de torsion du limiteur risquant de s’être déformées sans que cela ne soit visible.</div></div>
